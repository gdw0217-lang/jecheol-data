# 제철장보기 시세 갱신
# KAMIS 일별 소매가격은 조사일 오후 3시쯤 등록된다. 하루 세 번 받아 docs/market.json 을 갱신하고 Pages 로 내보낸다.
# 받기가 실패하면(품목이 너무 적거나 KAMIS 오류) 이전 파일이 그대로 남고, 계정 메일로 실패 알림이 간다.
name: update-prices

on:
  schedule:
    - cron: "0 8 * * *"    # 17:00 KST
    - cron: "0 12 * * *"   # 21:00 KST
    - cron: "0 22 * * *"   # 다음 날 07:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: KAMIS 시세 받기
        env:
          KAMIS_SERVICE_KEY: ${{ secrets.KAMIS_SERVICE_KEY }}
        run: python scripts/fetch_market.py

      - name: 시세 파일 기록
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/market.json
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "시세 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
